name: bechat
description: "BeChat - Encrypted Offline P2P Messaging Framework"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_riverpod: ^2.6.1
  uuid: ^4.5.1
  intl: ^0.20.2
  # Online transport (Firestore) + anonymous device authentication.
  firebase_core: ^3.15.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.6
  go_router: ^14.8.1
  bluetooth_low_energy: 6.2.1
  bechat_crypto:
    path: native/rust_builder
  # Sharing the public BeChat ID (copy uses the built-in clipboard).
  share_plus: ^12.0.2
  firebase_storage: ^12.4.10
  file_picker: ^11.0.3
  open_filex: ^5.0.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4+4
  mockito: ^5.4.5
  build_runner: ^2.4.15
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
